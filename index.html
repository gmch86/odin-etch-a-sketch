<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Etch-a-sketch</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./script.js" defer></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&icon_names=format_color_fill,looks,ink_eraser,join_left,light_mode,ev_shadow,undo,redo&display=block"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="wrapper">
      <header><h1>Etch-a-sketch</h1></header>
      <main>
        <section class="grid-settings">
          <div class="grid-size-container">
            <label for="grid-size"
              >Grid Size<input type="number" id="grid-size" inputmode="decimal"
            /></label>
            <button type="button" class="build-grid-btn">Create New</button>
          </div>
          <label for="toggle-grid"
            >Toggle Grid<input type="checkbox" id="toggle-grid" checked
          /></label>
          <label for="color-select">
            <input type="color" title="color-select" id="color-select" />
          </label>
        </section>
        <section class="grid-container"><!-- Tiles --></section>
        <section class="paint-tools">
          <button type="button" class="paint-mode-btn" data-paintmode="fill">
            <span class="material-symbols-outlined fill-icon"
              >format_color_fill</span
            >
            Fill
          </button>
          <button type="button" class="paint-mode-btn" data-paintmode="blend">
            <span class="material-symbols-outlined blend-icon">join_left</span>
            Blend
          </button>
          <button type="button" class="paint-mode-btn" data-paintmode="darken">
            <span class="material-symbols-outlined darken-icon">ev_shadow</span>
            Darken
          </button>
          <button type="button" class="paint-mode-btn" data-paintmode="lighten">
            <span class="material-symbols-outlined lighten-icon"
              >light_mode</span
            >
            Lighten
          </button>
          <button type="button" class="paint-mode-btn" data-paintmode="erase">
            <span class="material-symbols-outlined eraser-icon"
              >ink_eraser</span
            >
            Eraser
          </button>
          <button type="button" class="paint-mode-btn" data-paintmode="rainbow">
            <span class="material-symbols-outlined rainbow-icon">looks</span>
            Rainbow
          </button>
          <button type="button" class="undo-btn">
            <span class="material-symbols-outlined undo-icon">undo</span>Undo
          </button>
          <button type="button" class="redo-btn">
            <span class="material-symbols-outlined redo-icon">redo</span>Redo
          </button>
        </section>
      </main>
    </div>
    <footer>
      <p>&copy; 2026 gmch86 - The Odin Project</p>
    </footer>
  </body>
</html>
